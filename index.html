<style>
:root {
    --pink: #fce8ed;
    --rose: #e8b5c1;
    --deep: #a85b6c;
    --gold: #d4af70;

}

* {

}

html {

}

body {

}

/* GOLD TEXT */

.gold-text {
    background: linear-gradient(
        135deg,
        #a87935,
        #f9e6aa,
        #b8893e,
        #fff1c9,

    );
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* PARTICLES */

#orbCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 8;
}

/* SMALLER COVER VIDEO */

#cover-section {
    position: relative;
    width: 90%;
    max-width: 460px;
    height: auto;
    aspect-ratio: 9 / 16;
    max-height: 75svh;
    margin: 25px auto 20px;

}

#heroVideo {

/* MUSIC INTRO */

.music-intro {

}

.music-message {
    font-family: 'Great Vibes', cursive;

    line-height: 1.2;

}

/* LUXURY MUSIC PLAYER */

.music-position {
    position: static;
    z-index: 15;
    width: 88%;
    max-width: 290px;
    margin: 0 auto;
}

.music-player {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 15px 9px 10px;

    background: rgba(255, 237, 241, 0.94);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border: 1px solid rgba(212, 175, 112, 0.85);
    border-radius: 50px;

    box-shadow:
        0 8px 25px rgba(122, 66, 78, 0.18),
        inset 0 1px 5px rgba(255,255,255,0.8);

    transition: all .3s ease;
}

.music-player:active {
    transform: scale(.98);
}

.play-button {
    width: 38px;
    height: 38px;
    min-width: 38px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.7);
    color: white;
    background: linear-gradient(145deg, #e5b4c0, #a85b6c);
    box-shadow: 0 3px 12px rgba(168,91,108,.3);
    cursor: pointer;
}

.music-title {
    font-family: 'Playfair Display', serif;
    font-size: 11px;
    letter-spacing: .5px;
    color: #995567;
    font-weight: 600;
}

.music-subtitle {
    font-size: 9px;
    color: #a58b87;
    margin-top: 2px;
}

.equalizer {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 24px;
}

.equalizer span {
    width: 2px;
    height: 6px;
    border-radius: 5px;
    background: #c69b5a;
}

.equalizer.playing span {
    animation: equalize .65s ease-in-out infinite alternate;
}

.equalizer span:nth-child(2) {
    animation-delay: .2s;
}

.equalizer span:nth-child(3) {
    animation-delay: .4s;
}

.equalizer span:nth-child(4) {
    animation-delay: .1s;
}

@keyframes equalize {
    from { height: 4px; }
    to { height: 20px; }
}

/* SMALLER INVITATION GALLERY */

#gallery {
    position: relative;
    z-index: 5;

    max-width: 460px;

.gallery-section {

/* COUNTDOWN - MOVED UP */

.countdown-overlay {

.countdown {

<script>

/* 1. MUSIC PLAYER */

const audio = document.getElementById('bgMusic');
const playIcon = document.getElementById('playIcon');
const equalizer = document.getElementById('equalizer');

function updateMusicPlayer(playing) {

    if (playing) {

        playIcon.classList.remove('fa-play');
        playIcon.classList.add('fa-pause');

        equalizer.classList.add('playing');

    } else {

        playIcon.classList.remove('fa-pause');
        playIcon.classList.add('fa-play');

        equalizer.classList.remove('playing');

    }

}

async function toggleAudio(e) {

    if (e) e.stopPropagation();

    if (audio.paused) {

        try {

            await audio.play();
            updateMusicPlayer(true);

        } catch (error) {

            console.log("Music playback could not start:", error);

        }

    } else {

        audio.pause();
        updateMusicPlayer(false);

    }

}

audio.addEventListener('play', () => updateMusicPlayer(true));
audio.addEventListener('pause', () => updateMusicPlayer(false));


/* 2. COUNTDOWN - JULY 22, 2027 */

const targetDate = new Date(
    'July 22, 2027 00:00:00'
).getTime();

function updateCountdown() {

    const now = Date.now();
    const difference = targetDate - now;

    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');

    if (difference <= 0) {

        daysEl.textContent = '00';
        hoursEl.textContent = '00';
        minutesEl.textContent = '00';
        secondsEl.textContent = '00';

        return;

    }

    const days = Math.floor(
        difference / (1000 * 60 * 60 * 24)
    );

    const hours = Math.floor(
        (difference % (1000 * 60 * 60 * 24)) /
        (1000 * 60 * 60)
    );

    const minutes = Math.floor(
        (difference % (1000 * 60 * 60)) /
        (1000 * 60)
    );

    const seconds = Math.floor(
        (difference % (1000 * 60)) / 1000
    );

    daysEl.textContent = String(days).padStart(2, '0');
    hoursEl.textContent = String(hours).padStart(2, '0');
    minutesEl.textContent = String(minutes).padStart(2, '0');
    secondsEl.textContent = String(seconds).padStart(2, '0');

}

updateCountdown();
setInterval(updateCountdown, 1000);


/* 3. RSVP MODAL */

function openRsvpModal() {

    document.getElementById('rsvpModal').classList.remove('hidden');

    document.body.style.overflow = 'hidden';

}

function closeRsvpModal() {

    document.getElementById('rsvpModal').classList.add('hidden');

    document.body.style.overflow = '';

}

function handleRsvpSubmit(e) {

    e.preventDefault();

    document.getElementById('rsvpForm').classList.add('hidden');

    document.getElementById('rsvpSuccessMsg').classList.remove('hidden');

}

document.getElementById('rsvpModal').addEventListener('click', function(e) {

    if (e.target === this) {
        closeRsvpModal();
    }

});


/* 4. PINK & GOLD PARTICLES */

const canvas = document.getElementById('orbCanvas');
const ctx = canvas.getContext('2d');

let width, height;

function resizeCanvas() {

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

}

resizeCanvas();

window.addEventListener('resize', resizeCanvas);


class TinyDot {

    constructor() {
        this.reset(true);
    }

    reset(initial = false) {

        this.x = Math.random() * width;

        this.y = initial
            ? Math.random() * height
            : height + 10;

        this.radius = Math.random() * 1.5 + .5;

        this.speedX = (Math.random() - .5) * .35;

        this.speedY = -(Math.random() * .4 + .1);

        this.alpha = Math.random() * .55 + .2;

        this.gold = Math.random() > .45;

    }

    update() {

        this.x += this.speedX;
        this.y += this.speedY;

        if (this.y < -10) {
            this.reset();
        }

    }

    draw() {

        ctx.save();

        ctx.globalAlpha = this.alpha;

        ctx.fillStyle = this.gold
            ? '#d4af70'
            : '#e8b5c1';

        ctx.shadowBlur = 7;

        ctx.shadowColor = this.gold
            ? '#f8e5b6'
            : '#fff0f4';

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();

    }

}


const dots = Array.from(
    { length: 65 },
    () => new TinyDot()
);


function animateDots() {

    ctx.clearRect(0, 0, width, height);

    dots.forEach(dot => {

        dot.update();
        dot.draw();

    });

    requestAnimationFrame(animateDots);

}

animateDots();

</script>
